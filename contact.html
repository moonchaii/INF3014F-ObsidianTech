<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #navbar a:hover {color: #1b263b !important;}
        #navbar i:hover {color: #1b263b !important;}
        #navbar a.active {color: #1b263b !important;}
    </style>
</head>

<body style="margin: 0; padding: 0;">
    <!-- Header section with logo and navigation bar -->
    <section id="header" style="background-color:#e0e1dd; display: flex; align-items: center; justify-content: space-between; padding: 30px 80px; width: 100%; margin: 0; box-sizing: border-box; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);">
        <a href = "index.html"><img src="Obsidian-Logo.png" class="logo" alt="Obsidian Tech Logo" style="width: 120px; height: auto;"></a>
        <div>
            <ul id="navbar" style="display: flex; align-items: center; justify-content: center; list-style: none;">
                <li style="padding: 0px 20px;"><a href="index.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">Home</a></li>
                <li style="padding: 0px 20px;"><a href="about.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">About Us</a></li>
                <li style="padding: 0px 20px;"><a href="products.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">Products</a></li>
                <li style="padding: 0px 20px;"><a class="active" href="contact.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">Contact</a></li>
                <li style="padding: 0px 20px;"><a href="cart.html"><i class="fa-solid fa-cart-shopping" style="color: #415a77; transition: 0.3s ease;"></i></a></li>
            </ul>
        </div>
    </section>

    <!-- Contact section wrapper -->
    <section id="contact-info" style="padding: 30px 80px; width: 100%; margin: 0; box-sizing: border-box; display: flex; gap: 40px;">
        <!-- Contact details -->
        <div id="contact" style="flex: 1;">
            <h2 style="font-family: 'Roboto'; color: #1b263b; font-size: 46px; height: 54px; display: flex; align-items: center; justify-content: center;">Contact us today!</h2>
            <div>
                <li style="font-family: 'Inconsolata'; color: #415a77; font-size: 18px; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-phone" style="color: #415a77; margin-right: 10px;"></i>
                    <p>+27 123 456 789</p>
                </li>
                <li style="font-family: 'Inconsolata'; color: #415a77; font-size: 18px; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-envelope" style="color: #415a77; margin-right: 10px;"></i>
                    <p>info@obsidiantech.com</p>
                </li>
            </div>
        </div>

        <!-- Contact form -->
        <div id="contact-form" style="flex: 1;">
            <h2 style="font-family: 'Roboto'; color: #1b263b; font-size: 46px; height: 54px; display: flex; align-items: center; justify-content: center;">Leave a Message</h2>
            <form>
                <input type="text" placeholder="Name" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
                <input type="email" placeholder="Email" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
                <textarea placeholder="Your message" rows="4" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; "></textarea>
                <button type="submit" style="background-color: #1b263b; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </section>

</body>

</html>
