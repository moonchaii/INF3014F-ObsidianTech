<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Tech</title>
    <!-- Google fonts and Font Awesome for icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Special style changes -->
    <style>
        #navbar a:hover {color: #1b263b !important;}
        #navbar i:hover {color: #1b263b !important;}
        #navbar a.active {color: #1b263b !important;}
        #navbar a.active i {color: #1b263b !important;}
        #products .product:hover {box-shadow: 20px 20px 30px rgba(0, 0, 0, 0.02); transition: 0.2s ease;}
        /* make product cards narrower to reduce space between them */
        .product {width: 20% !important; margin: 10px 0 !important;}
        .product-container {gap: 10px;}
    </style>
</head>

<body style="margin: 0; padding: 0;">
    <!-- Header section with logo and navigation bar -->
    <section id="header" style="background-color:#e0e1dd; display: flex; align-items: center; justify-content: space-between; padding: 30px 80px; width: 100%; margin: 0; box-sizing: border-box; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);">
        <a href = "index.html"><img src="Obsidian-Logo.png" class="logo" alt="Obsidian Tech Logo" style="width: 120px; height: auto;"></a>
        <div>
            <ul id="navbar" style="display: flex; align-items: center; justify-content: center; list-style: none;">
                <li style="padding: 0px 20px;"><a class="active" href="index.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">Home</a></li>
                <li style="padding: 0px 20px;"><a href="about.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">About Us</a></li>
                <li style="padding: 0px 20px;"><a href="products.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">Products</a></li>
                <li style="padding: 0px 20px;"><a href="contact.html" style="color: #415a77; text-decoration: none; font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 600; transition: 0.3s ease;">Contact</a></li>
                <li style="padding: 0px 20px;"><a href="cart.html"><i class="fa-solid fa-cart-shopping" style="color: #415a77; transition: 0.3s ease;"></i></a></li>
            </ul>
        </div>
    </section>

    <!-- Checkout -->
    <section id="checkout" style="padding: 30px 80px; width: 100%; margin: 0; box-sizing: border-box;">

        <h1 style="font-family: 'Roboto'; color: #1b263b; font-size: 50px; align-items: center; display: flex; justify-content: center;">Checkout</h1>

        <div style="display: flex; gap: 40px; align-items: flex-start; margin-top: 10px;">

            <!-- Delivery + Payment stacked -->
            <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 20px;">

                <!-- Delivery Details -->
                <div style="border: 1px solid #ccc; padding: 10px 24px; border-radius: 25px; box-shadow: 20px 20px 30px rgba(0, 0, 0, 0.02);">
                    <div style="padding: 10px 0;">
                        <h5 style="font-family: 'Inconsolata'; color: #1b263b; font-size: 24px; margin: 10px 0; padding-top: 7px;">Delivery Details</h5>
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">First Name</label>
                        <input type="text" placeholder="John" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Last Name</label>
                        <input type="text" placeholder="Doe" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Email Address</label>
                        <input type="email" placeholder="john.doe@example.com" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Street Address</label>
                        <input type="text" placeholder="123 Main St" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">City</label>
                        <input type="text" placeholder="Cape Town" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Postal Code</label>
                        <input type="text" placeholder="8001" style="width: 100%; padding: 10px; margin-bottom: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                    </div>
                </div>

                <!-- Payment Details -->
                <div style="border: 1px solid #ccc; padding: 10px 24px; border-radius: 25px; box-shadow: 20px 20px 30px rgba(0, 0, 0, 0.02);">
                    <div style="padding: 10px 0;">
                        <h5 style="font-family: 'Inconsolata'; color: #1b263b; font-size: 24px; margin: 10px 0; padding-top: 7px;">Payment Details</h5>
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Cardholder Name</label>
                        <input type="text" placeholder="John Doe" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                        <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Card Number</label>
                        <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Inconsolata'; letter-spacing: 2px;">
                        <div style="display: flex; gap: 16px;">
                            <div style="flex: 1;">
                                <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">Expiry Date</label>
                                <input type="text" placeholder="MM / YY" maxlength="7" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Inconsolata';">
                            </div>
                            <div style="flex: 1;">
                                <label style="display: block; font-family: 'Roboto'; color: #1b1b1b; font-size: 12px; font-weight: 600; margin-bottom: 5px;">CVV</label>
                                <input type="text" placeholder="123" maxlength="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Inconsolata';">
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Order Summary -->
            <div style="width: 350px; flex-shrink: 0;">
                <div style="border: 1px solid #ccc; padding: 10px 24px; border-radius: 25px; box-shadow: 20px 20px 30px rgba(0, 0, 0, 0.02);">
                    <div style="padding: 10px 0;">
                        <h5 style="font-family: 'Inconsolata'; color: #1b263b; font-size: 24px; margin: 10px 0; padding-top: 7px;">Order Summary</h5>

                        <!-- MacBook Air -->
                        <div style="display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid #eee; margin-bottom: 16px;">
                            <img src="macbook-air.jpg" alt="MacBook Air" style="width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 1px solid #eee;">
                            <div style="flex: 1;">
                                <span style="display: block; font-family: 'Roboto'; color: #778da9; font-size: 11px;">Apple</span>
                                <h5 style="font-family: 'Inconsolata'; color: #1b263b; font-size: 14px; font-weight: 700; margin: 4px 0;">MacBook Air</h5>
                                <span style="font-family: 'Roboto'; color: #778da9; font-size: 12px;">Qty: 1</span>
                            </div>
                            <span style="font-family: 'Roboto'; color: #1b263b; font-size: 14px; font-weight: 700;">R14 999.00</span>
                        </div>

                        <!-- AirPods -->
                        <div style="display: flex; align-items: center; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid #eee; margin-bottom: 16px;">
                            <img src="airpods.jpg" alt="AirPods" style="width: 80px; height: 80px; object-fit: cover; border-radius: 12px; border: 1px solid #eee;">
                            <div style="flex: 1;">
                                <span style="display: block; font-family: 'Roboto'; color: #778da9; font-size: 11px;">Apple</span>
                                <h5 style="font-family: 'Inconsolata'; color: #1b263b; font-size: 14px; font-weight: 700; margin: 4px 0;">AirPods</h5>
                                <span style="font-family: 'Roboto'; color: #778da9; font-size: 12px;">Qty: 2</span>
                            </div>
                            <span style="font-family: 'Roboto'; color: #1b263b; font-size: 14px; font-weight: 700;">R3 998.00</span>
                        </div>

                        <!-- Totals -->
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="font-family: 'Roboto'; color: #778da9; font-size: 14px;">Subtotal</span>
                            <span style="font-family: 'Roboto'; color: #1b263b; font-size: 14px;">R18 997.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                            <span style="font-family: 'Roboto'; color: #778da9; font-size: 14px;">Shipping</span>
                            <span style="font-family: 'Roboto'; color: #1b263b; font-size: 14px;">R500.00</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding-top: 14px; border-top: 2px solid #ccc; margin-bottom: 20px;">
                            <span style="font-family: 'Roboto'; color: #1b263b; font-size: 16px; font-weight: 700;">Total</span>
                            <span style="font-family: 'Roboto'; color: #1b263b; font-size: 16px; font-weight: 700;">R19 497.00</span>
                        </div>

                        <button style="width: 100%; background-color: #1b263b; color: #fff; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-family: 'Roboto'; font-size: 15px; font-weight: 600; transition: 0.3s ease;">Place Order</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
